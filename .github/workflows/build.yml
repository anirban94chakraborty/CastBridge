name: build

# Builds the app, runs the tests, and produces the installer as a downloadable artifact. The
# executable itself is deliberately not committed: attach the artifact to a release by hand, or
# download it from this workflow's run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build CastBridge.slnx -c Release

      - name: Test
        run: dotnet test tests/CastBridge.Tests/CastBridge.Tests.csproj -c Release --no-build

      - name: Build the installer
        shell: pwsh
        run: ./tools/build-installer.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: CastBridge-setup
          path: dist/CastBridge-*-Setup.exe
          if-no-files-found: error
          retention-days: 30
